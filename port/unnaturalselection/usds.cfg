# Unnatural Selection DS — settings
# Lines are "key = value". Delete a line to get the built-in default back.

# ---------------------------------------------------------------- game
# Game executable, relative to this folder. The DOS files go in gamedata/.
content = gamedata/uns.exe
# DOSBox Pure core. Leave commented to use the system core
# (/usr/lib/libretro/dosbox_pure_libretro.so on ROCKNIX).
# core = dosbox_pure_libretro.so

# ---------------------------------------------------------------- views
# Game row (of 200) where the screen is split into top and bottom halves.
# 120 = top edge of the DigiLife floppy-drive housing.
slice_row = 120
# Pan step for a single L/R press, in game pixels (the game is 320 wide)
pan_step = 32
# Pan speed while L/R is held, game pixels per second
pan_speed = 240
# Scaling: sharp (crisp pixels, smooth edges), nearest, linear
filter = sharp
# 1 = put the full view on the bottom panel and the zoomed view on top
swap_screens = 0
# Desk screen: 1 = show the title card on the top screen, 0 = mirror the desk
# (the title card is grabbed during the intro and kept in saves/title.bmp)
desk_title = 1

# ---------------------------------------------------------------- pointer
# Move the pointer out of the way after a tap and paint the game's cursor out
# while it's parked. It stays put while a game menu is open.
park_pointer = 1
hide_parked_cursor = 1
# Frames (1/70 s) to wait after a tap before parking
park_delay_frames = 45
# Where to park it, in game pixels (the game is 320x200)
park_x = 319
park_y = 199

# ---------------------------------------------------------------- exit
# 1 = close the port when the game exits to DOS (EXIT on the desk keyboard)
exit_with_game = 1

# ---------------------------------------------------------------- buttons
# Button names are SDL's. On the RG DS under ROCKNIX:
#   a = B (bottom), b = A (right), x = X (top), y = Y (left)
#   lefttrigger/righttrigger and leftshoulder/rightshoulder are the shoulder
#   pairs, back = Select, start = Start, guide = Home,
#   leftstick/rightstick = L3/R3, dpup/dpdown/dpleft/dpright = D-pad.
#   key:NAME = a keyboard key (e.g. key:F1); BTN_BACK / evdev:CODE = a raw
#   kernel button code. Buttons that aren't bound are listed in log.txt.
# Several buttons can share an action: separate them with commas. The defaults
# mirror each action on the D-pad side and the face-button side, so the
# buttons work with whichever hand isn't holding the stylus.
bind_top = dpup,x
bind_bottom = dpdown,a
bind_pan_left = leftshoulder,rightshoulder
bind_pan_right = lefttrigger,righttrigger
bind_disk = start,leftstick
bind_shift = y,dpleft
# BACK arrives as the F1 key through ROCKNIX's input service, or as BTN_BACK
bind_keyboard = back,key:F1,BTN_BACK
# Right click: hold this button and tap (tapping with two fingers also works)
bind_right_click = b,dpright
bind_escape =
bind_enter =
bind_hotkey = guide
# Hold Home this long (ms) to quit
home_hold_ms = 1000

# ---------------------------------------------------------------- touch
# auto = read the touch panel directly (most reliable on ROCKNIX), sdl = use
# the compositor's touch events
touch_source = auto
# Text in the sysfs path of the touch panel to prefer (RG DS Plus: i2c5)
touch_match = fe5e0000
# Fix rotated/mirrored touch if needed
touch_swap_xy = 0
touch_invert_x = 0
touch_invert_y = 0
# Frames (1/70 s) between moving the pointer and pressing on a tap. The game
# checks the mouse on its own schedule; shorter values can make menu items
# miss taps.
press_delay_frames = 10
# Shortest press the game will see, in frames
min_click_frames = 4

# ---------------------------------------------------------------- DOSBox Pure
dosbox_pure_mouse_input = direct
dosbox_pure_cycles = auto
dosbox_pure_sblaster_conf = A220 I7 D1 H5
dosbox_pure_menu_time = 0
